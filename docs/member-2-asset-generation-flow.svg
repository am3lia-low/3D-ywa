<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">How a story passage becomes an explorable 3D world</title>
  <desc id="desc">A user selects a passage. Narrative data becomes a spatial layout. Existing exact or semantic assets are reused; otherwise a story-specific asset is generated. The renderer then performs real loading before the user explores rooms and inspects story evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#49656c"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17323a" flood-opacity="0.13"/></filter>
    <style>
      .title{font:700 40px 'Segoe UI',Arial,sans-serif;fill:#17323a}.subtitle{font:20px 'Segoe UI',Arial,sans-serif;fill:#52666c}.section{font:700 21px 'Segoe UI',Arial,sans-serif;letter-spacing:.6px;fill:#17323a}.head{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#17323a}.body{font:17px 'Segoe UI',Arial,sans-serif;fill:#40565d}.small{font:15px 'Segoe UI',Arial,sans-serif;fill:#52666c}.branch{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#49656c}.box{stroke-width:2;rx:16;filter:url(#shadow)}.line{fill:none;stroke:#49656c;stroke-width:3;marker-end:url(#arrow)}.join{fill:none;stroke:#49656c;stroke-width:3}
    </style>
  </defs>
  <rect width="1800" height="980" fill="#f7f3e9"/>
  <text x="54" y="64" class="title">How a story passage becomes an explorable 3D world</text>
  <text x="54" y="100" class="subtitle">The reader keeps reading while Member 2 resolves assets, builds the space, and performs real renderer loading.</text>

  <text x="54" y="154" class="section">1 · FROM PASSAGE TO WORLD PLAN</text>
  <rect class="box" x="54" y="182" width="300" height="142" fill="#e2f0f3" stroke="#398596"/>
  <text x="204" y="220" text-anchor="middle" class="head">Reader selects a passage</text>
  <text x="80" y="254" class="body">The story continues in the reader</text><text x="80" y="282" class="body">while its 3D scene prepares.</text>
  <path class="line" d="M354 253H406"/>

  <rect class="box" x="406" y="182" width="338" height="142" fill="#e1efe9" stroke="#2d8a73"/>
  <text x="575" y="220" text-anchor="middle" class="head">Understand the story</text>
  <text x="432" y="254" class="body">entities, locations and relations</text><text x="432" y="282" class="body">visual style, evidence and IDs</text>
  <path class="line" d="M744 253H796"/>

  <rect class="box" x="796" y="182" width="338" height="142" fill="#e1efe9" stroke="#2d8a73"/>
  <text x="965" y="220" text-anchor="middle" class="head">Build the spatial layout</text>
  <text x="822" y="254" class="body">room size, doors and connections</text><text x="822" y="282" class="body">support, scale, spacing and placement</text>
  <path class="line" d="M1134 253H1186"/>

  <polygon points="1360,176 1534,253 1360,330 1186,253" fill="#f5eddd" stroke="#b87a20" stroke-width="2" filter="url(#shadow)"/>
  <text x="1360" y="238" text-anchor="middle" class="head">Asset match</text>
  <text x="1360" y="266" text-anchor="middle" class="head">available?</text>

  <text x="1548" y="220" class="branch">YES</text>
  <path class="line" d="M1534 253H1582"/>
  <rect class="box" x="1582" y="182" width="164" height="142" fill="#e5f2e7" stroke="#388556"/>
  <text x="1664" y="220" text-anchor="middle" class="head">Reuse it</text>
  <text x="1604" y="254" class="body">exact ID or</text><text x="1604" y="282" class="body">safe match</text>

  <text x="1328" y="357" class="branch">NO</text>
  <path class="line" d="M1360 330V391"/>

  <text x="54" y="404" class="section">2 · WHEN AN ASSET IS NOT ALREADY AVAILABLE</text>
  <rect x="54" y="430" width="1692" height="236" rx="22" fill="#eef0f4" stroke="#c6ccd8" stroke-width="2"/>

  <rect class="box" x="104" y="476" width="330" height="138" fill="#e2f0f3" stroke="#398596"/>
  <text x="269" y="514" text-anchor="middle" class="head">Try a safe semantic match</text>
  <text x="130" y="548" class="body">object tags + story style</text><text x="130" y="576" class="body">dimensions + material role</text>
  <path class="line" d="M434 545H490"/>

  <polygon points="650,472 810,545 650,618 490,545" fill="#f5eddd" stroke="#b87a20" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="532" text-anchor="middle" class="head">Safe close</text><text x="650" y="560" text-anchor="middle" class="head">match?</text>

  <text x="820" y="510" class="branch">YES</text>
  <path class="line" d="M810 545H872"/>
  <rect class="box" x="872" y="476" width="296" height="138" fill="#e5f2e7" stroke="#388556"/>
  <text x="1020" y="514" text-anchor="middle" class="head">Use approved similar asset</text>
  <text x="898" y="548" class="body">fit it to the story dimensions</text><text x="898" y="576" class="body">and visual style</text>

  <text x="612" y="646" class="branch">NO</text>
  <path class="line" d="M650 618V642H1216V545H1258"/>
  <rect class="box" x="1258" y="476" width="414" height="138" fill="#f5eddd" stroke="#b87a20"/>
  <text x="1465" y="514" text-anchor="middle" class="head">Generate the missing story asset</text>
  <text x="1284" y="548" class="body">create → optimize → validate proportions</text><text x="1284" y="576" class="body">fallback remains usable until it is ready</text>

  <path class="join" d="M1664 324V690H1020V614"/>
  <path class="join" d="M1465 614V690"/>
  <path class="line" d="M1020 690H207V744"/>

  <text x="54" y="720" class="section">3 · REAL LOADING AND THE READER EXPERIENCE</text>
  <rect class="box" x="54" y="750" width="306" height="150" fill="#e2f0f3" stroke="#398596"/>
  <text x="207" y="788" text-anchor="middle" class="head">Assemble the world</text>
  <text x="80" y="822" class="body">place assets on valid supports</text><text x="80" y="850" class="body">connect every story location</text><text x="80" y="878" class="body">apply lighting and atmosphere</text>
  <path class="line" d="M360 825H412"/>

  <rect class="box" x="412" y="750" width="338" height="150" fill="#e1efe9" stroke="#2d8a73"/>
  <text x="581" y="788" text-anchor="middle" class="head">Preparing the 3D scene…</text>
  <text x="438" y="822" class="body">load real models and textures</text><text x="438" y="850" class="body">warm every chapter location</text><text x="438" y="878" class="body">wait for rendered frames</text>
  <path class="line" d="M750 825H802"/>

  <rect class="box" x="802" y="750" width="274" height="150" fill="#e5f2e7" stroke="#388556"/>
  <text x="939" y="788" text-anchor="middle" class="head">3D scene ready</text>
  <text x="828" y="822" class="body">same warmed world opens</text><text x="828" y="850" class="body">without rebuilding</text>
  <path class="line" d="M1076 825H1128"/>

  <rect class="box" x="1128" y="750" width="298" height="150" fill="#e5f2e7" stroke="#388556"/>
  <text x="1277" y="788" text-anchor="middle" class="head">Explore the story world</text>
  <text x="1154" y="822" class="body">POV, overview and walking</text><text x="1154" y="850" class="body">click doors to enter rooms</text><text x="1154" y="878" class="body">later passages update the world</text>
  <path class="line" d="M1426 825H1478"/>

  <rect class="box" x="1478" y="750" width="268" height="150" fill="#ece9f5" stroke="#7060a4"/>
  <text x="1612" y="788" text-anchor="middle" class="head">Click an object</text>
  <text x="1504" y="822" class="body">see its story identity</text><text x="1504" y="850" class="body">chapter and source passage</text><text x="1504" y="878" class="body">current and previous state</text>

  <text x="54" y="944" class="small">Exact assets are reused immediately. Unmatched objects are safely matched or generated without blocking the reader from continuing the novel.</text>
</svg>
